<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saboot — Voice-First Micro-Contracts &amp; Wage Escrow</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Inter:wght@400;500;600;700;800&family=Mukta:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&family=Noto+Sans+Gujarati:wght@400;700&family=Noto+Sans+Gurmukhi:wght@400;700&family=Noto+Sans+Kannada:wght@400;700&family=Noto+Sans+Malayalam:wght@400;700&family=Noto+Sans+Oriya:wght@400;700&family=Noto+Sans+Tamil:wght@400;700&family=Noto+Sans+Telugu:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{
  --bg:#f6f3ea;--card:#fffdf7;--ink:#17153b;--halt:#fffdf7;--mute:#5f5a7a;--line:#dfd4b8;--soft:#efe8d5;
  --deep:#17153b;--hal:#f4a300;--hal-soft:#fff3d1;--emp:#0f766e;--emp-soft:#dcfce7;
  --ok:#0b7a6b;--bad:#c8341f;--okbg:#d3eee8;--badbg:#fadad2;
  --sc:#17153b;--bd:#17153b;--sh:3px 3px 0 var(--sc);--sh-lg:5px 5px 0 var(--sc);
  --dp:'Fraunces','Mukta',Georgia,serif;
  --sans:'Inter','Mukta','Noto Sans Devanagari','Noto Sans Bengali','Noto Sans Gujarati','Noto Sans Gurmukhi','Noto Sans Oriya','Noto Sans Tamil','Noto Sans Telugu','Noto Sans Kannada','Noto Sans Malayalam','Noto Nastaliq Urdu',system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0e0d24;--card:#18163a;--ink:#f7efdc;--halt:#0e0d24;--mute:#aba4cc;--line:#322d63;--soft:#23204f;
  --deep:#211e52;--hal:#f4a300;--hal-soft:#3d2f0d;--emp:#14b8a6;--emp-soft:#103a35;
  --ok:#5fd9c2;--bad:#ff8a73;--okbg:#10403a;--badbg:#472220;--sc:#000;--bd:#4a438f;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15.5px/1.48 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--hal);outline-offset:2px}
.ic{width:20px;height:20px;flex:none}

/* App Shell */
.shell{min-height:100dvh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;background:var(--deep);color:#fff;
  border-bottom:3px solid var(--hal);padding:12px 18px;
}
.topbar-in{max-width:1160px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font:900 22px var(--dp);letter-spacing:-.4px;color:#fff}
.brand small{font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.8px;background:#ffffff1a;padding:2px 8px;border-radius:99px;color:var(--hal)}
.top-ctrls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* Role Pill Switcher */
.role-sw{display:flex;background:#ffffff14;border:1.5px solid #ffffff30;border-radius:12px;padding:3px;gap:3px}
.role-sw button{border:0;background:none;color:#ffffffbf;font:700 13px var(--sans);padding:6px 12px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:.15s}
.role-sw button[aria-pressed="true"].w-active{background:var(--hal);color:#17153b}
.role-sw button[aria-pressed="true"].e-active{background:#14b8a6;color:#062925}

.top-btn{border:1.5px solid #ffffff30;background:#ffffff14;color:#fff;border-radius:11px;height:36px;padding:0 11px;font:700 13px var(--sans);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.top-btn:hover{background:#ffffff24}

/* Workspace Layout */
.workspace{flex:1;max-width:1160px;width:100%;margin:0 auto;display:grid;grid-template-columns:240px 1fr;gap:22px;padding:20px 18px 86px}
.sidebar{position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:12px}
.nav-card{background:var(--card);border:2px solid var(--bd);border-radius:20px;padding:10px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:4px}
.nav-btn{border:2px solid transparent;background:none;color:var(--mute);font:700 14.5px var(--sans);padding:11px 12px;border-radius:14px;display:flex;align-items:center;gap:10px;cursor:pointer;text-align:left;transition:.12s}
.nav-btn:hover{background:var(--soft);color:var(--ink)}
.nav-btn[aria-current="true"]{background:var(--hal);color:#17153b;border-color:var(--bd);box-shadow:2px 2px 0 var(--sc)}
.role-emp .nav-btn[aria-current="true"]{background:#14b8a6;color:#052e2b}
.nav-badge{margin-left:auto;background:var(--ink);color:var(--halt);font:800 11px var(--sans);padding:2px 7px;border-radius:99px}

.role-banner{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:14px;box-shadow:var(--sh);font-size:13px}
.role-banner b{display:block;font:800 14px var(--sans);margin-bottom:3px}
.role-banner span{color:var(--mute);display:block;line-height:1.35}

/* Mobile Bottom Nav */
.bnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:25;background:var(--card);border-top:2px solid var(--bd);padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px);gap:4px}
.bnav button{flex:1;border:0;background:none;color:var(--mute);font:700 11.5px var(--sans);padding:6px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative}
.bnav button[aria-current="true"]{background:var(--hal);color:#17153b}
.role-emp .bnav button[aria-current="true"]{background:#14b8a6;color:#052e2b}
.bnav .nbadge{position:absolute;top:2px;right:18%;background:var(--bad);color:#fff;font-size:10px;font-weight:800;padding:1px 5px;border-radius:99px}

/* Content Cards & Typography */
.page-hd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-hd h1{font:900 30px/1.08 var(--dp);margin:0;letter-spacing:-.6px}
.page-hd p{margin:4px 0 0;color:var(--mute);font-size:14.5px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:var(--sh-lg)}
.ct{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.ct h2{font:900 19px/1.2 var(--dp);margin:0;flex:1}
.chip{width:38px;height:38px;border-radius:12px;background:var(--hal-soft);border:2px solid var(--bd);display:grid;place-items:center;color:var(--ink);flex:none}
.role-emp .chip{background:var(--emp-soft)}
.sub{color:var(--mute);margin:0 0 12px;font-size:14.5px}

/* Buttons & Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--bd);border-radius:14px;min-height:46px;padding:0 18px;background:var(--hal);color:#17153b;font:700 15px var(--sans);cursor:pointer;box-shadow:3px 3px 0 var(--sc);transition:transform .1s,box-shadow .1s}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--sc)}
.btn:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
.btn.emp{background:#14b8a6;color:#052e2b}
.btn.dk{background:var(--ink);color:var(--halt)}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.bad{background:var(--badbg);color:var(--bad)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:11px;box-shadow:2px 2px 0 var(--sc)}
.icb{width:40px;height:40px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:2px 2px 0 var(--sc);flex:none}
.icb.speaking{background:var(--hal);color:#17153b;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}

/* KPI Grid */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:14px;box-shadow:var(--sh)}
.kpi b{display:block;font:900 26px/1.1 var(--dp);margin-bottom:3px}
.kpi span{font-size:12.5px;color:var(--mute);font-weight:600}
.kpi.hl{background:var(--hal-soft)}
.kpi.em{background:var(--emp-soft)}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 10px;font:700 12.5px var(--sans);border:1.5px solid transparent}
.pill .ic{width:14px;height:14px}
.pill.ok{background:var(--okbg);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.pill.bad{background:var(--badbg);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.pill.wait{background:var(--soft);color:var(--mute);border-color:var(--line)}
.pill.warn{background:var(--hal-soft);color:#8a5600;border-color:var(--hal)}

/* Work Tiles & Inputs */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{position:relative;background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:13px 6px;text-align:center;font:700 13.5px/1.2 var(--sans);color:var(--ink);cursor:pointer;box-shadow:var(--sh)}
.tile i{width:44px;height:44px;border-radius:50%;background:var(--soft);border:2px solid var(--bd);display:grid;place-items:center;margin:0 auto 7px}
.tile[aria-pressed="true"]{background:var(--hal-soft);transform:translate(2px,2px);box-shadow:1px 1px 0 var(--sc)}
.tile[aria-pressed="true"] i{background:var(--hal);color:#17153b}
.role-emp .tile[aria-pressed="true"]{background:var(--emp-soft)}
.role-emp .tile[aria-pressed="true"] i{background:#14b8a6;color:#052e2b}

.seg{display:flex;background:var(--soft);border:2px solid var(--bd);border-radius:13px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;border-radius:10px;min-height:38px;font:700 13.5px var(--sans);color:var(--mute);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--halt)}

.chips{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 12px}
.chips button{border:2px solid var(--bd);background:var(--card);color:var(--ink);border-radius:99px;padding:0 13px;min-height:34px;font:700 13.5px var(--sans);cursor:pointer;box-shadow:2px 2px 0 var(--sc)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--halt)}

.days{display:flex;gap:6px;margin:8px 0 12px}
.days button{flex:1;max-width:44px;aspect-ratio:1;border-radius:50%;border:2px solid var(--bd);background:var(--card);color:var(--ink);font:800 14px var(--sans);cursor:pointer}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--halt)}

.inp{width:100%;border:2px solid var(--bd);background:var(--card);color:var(--ink);border-radius:13px;padding:10px 13px;font:600 15px var(--sans)}
.amt-big{font:900 46px/1.1 var(--dp);text-align:center;margin:6px 0}
.amt-big small{font-size:22px;color:var(--mute);margin-right:3px}

/* Karaoke / Voice Summary Box */
.karaoke{background:var(--soft);border:2px dashed var(--bd);border-radius:16px;padding:14px;margin:12px 0;font-size:16px;line-height:1.6}
.kword{display:inline-block;padding:1px 3px;border-radius:5px;transition:background .12s,color .12s}
.kword.on{background:var(--hal);color:#17153b;font-weight:700}

/* Contract Ticket */
.tk{background:var(--card);border:2px solid var(--bd);border-radius:20px;box-shadow:var(--sh-lg);margin-bottom:16px;overflow:hidden}
.tkh{display:flex;gap:12px;align-items:center;padding:14px 16px;background:var(--deep);color:#fff}
.tkh .tkt{font:900 18px var(--dp)}
.tkh .tks{font-size:13px;color:#ffffffc4}
.tkh .pill{margin-left:auto}
.tkb{display:flex;gap:14px;padding:15px 16px;align-items:flex-start;flex-wrap:wrap}
.tkl{flex:1;min-width:210px}
.qr svg{display:block;width:82px;height:82px;border-radius:10px;background:#fff;padding:4px;border:1.5px solid var(--line)}
.dys{display:flex;gap:4px;margin-bottom:8px}
.dys i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 11px/1 var(--sans);font-style:normal;background:var(--soft);color:var(--mute)}
.dys i.on{background:var(--ink);color:var(--halt)}
.emoji-fp{display:inline-flex;align-items:center;gap:6px;background:var(--hal-soft);border:1.5px solid var(--bd);border-radius:10px;padding:3px 9px;font-size:14px;font-weight:700;margin:6px 0}
.hash{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--mute);word-break:break-all}

.esc-box{margin:0 16px 14px;border:2px dashed var(--bd);border-radius:15px;padding:12px;background:color-mix(in srgb,var(--hal) 8%,var(--card))}
.drow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px;flex-wrap:wrap}
.drow span{display:block;font-size:11.5px;color:var(--mute)}

/* Trust Gauge */
.gauge{position:relative;max-width:240px;margin:4px auto 0}
.gauge svg{width:100%;display:block}
.g0,.g1{fill:none;stroke-width:9;stroke-linecap:round}
.g0{stroke:var(--soft)}
.g1{stroke:var(--hal);transition:stroke-dasharray .6s}
.gauge .tier{position:absolute;left:0;right:0;bottom:0;text-align:center;font:900 30px var(--dp)}
.steps{display:flex;gap:6px;margin:12px 0 6px}
.steps span{flex:1;text-align:center;font:700 12px var(--sans);padding:6px 0;border-radius:9px;background:var(--soft);color:var(--mute)}
.steps .on{background:var(--ink);color:var(--halt)}

/* Language Grid & Modal */
.modal{position:fixed;inset:0;background:#0b1225a6;backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;z-index:40}
.modal .card{max-width:660px;width:100%;max-height:88vh;overflow:auto;margin:0}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:9px;margin:12px 0}
.lbtn{border:2px solid var(--bd);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 11px;text-align:left;cursor:pointer;box-shadow:2px 2px 0 var(--sc);display:flex;flex-direction:column;gap:3px}
.lbtn[aria-pressed="true"]{background:var(--hal);color:#17153b}
.lbtn strong{font-size:16px;line-height:1.2}
.lbtn small{font-size:11.5px;opacity:.8}
.vbadge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:99px;background:var(--soft);color:var(--ink);align-self:flex-start;margin-top:2px}
.vbadge.os{background:var(--okbg);color:var(--ok)}
.vbadge.fb{background:var(--hal-soft);color:#7c4d00}

/* Role Onboarding Overlay */
.onboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:16px}
.auth-box{max-width:480px;margin:18px auto 0;background:var(--card);border:2px solid var(--bd);border-radius:22px;padding:22px;box-shadow:var(--sh-lg)}
.auth-tabs{display:flex;background:var(--soft);border:2px solid var(--bd);border-radius:14px;padding:4px;gap:4px;margin-bottom:16px}
.auth-tabs button{flex:1;border:0;background:none;border-radius:10px;min-height:42px;font:800 14px var(--sans);color:var(--mute);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.auth-tabs button[aria-pressed="true"].w{background:var(--hal);color:#17153b}
.auth-tabs button[aria-pressed="true"].e{background:#14b8a6;color:#052e2b}
.demo-accts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.demo-accts button{border:1.5px solid var(--bd);background:var(--soft);color:var(--ink);border-radius:99px;padding:4px 10px;font:700 12px var(--sans);cursor:pointer}
.user-pill{display:inline-flex;align-items:center;gap:6px;background:#ffffff18;border:1.5px solid #ffffff30;border-radius:99px;padding:4px 11px;font:700 12.5px var(--sans);color:#fff}

.rcard{background:var(--card);border:2px solid var(--bd);border-radius:22px;padding:20px;box-shadow:var(--sh-lg);display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:.15s}
.rcard:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--sc)}
.rcard h2{font:900 24px var(--dp);margin:0}
.rcard ul{margin:0;padding-left:18px;font-size:14px;color:var(--mute);display:grid;gap:6px}

.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--halt);border:2px solid var(--hal);padding:11px 18px;border-radius:14px;font:700 14px var(--sans);z-index:50;max-width:92vw;text-align:center}
.hold{position:relative;overflow:hidden;user-select:none;touch-action:none}
.hold:after{content:"";position:absolute;left:0;bottom:0;height:5px;width:0;background:#17153b}
.hold.go:after{width:100%;transition:width 1.2s linear}

@media (max-width:860px){
  .workspace{grid-template-columns:1fr;padding:14px 12px 92px}
  .sidebar{display:none}
  .bnav{display:flex}
}
@media (max-width:480px){
  .grid3{grid-template-columns:repeat(2,1fr)}
  .page-hd h1{font-size:25px}
}
</style>
</head>

<symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 018 0v3"/></symbol>

<symbol id="i-cal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
<symbol id="i-rupee" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5h10M7 9h10M7 5c6 0 6 8 0 8H6l8 7"/></symbol>

  const candidates=[p2,...(alt[lang]||[])];
  let exact=voices.find(v=>v.lang.replace('_','-').toLowerCase()===target);
  if(exact)return exact;
  for(const c of candidates){
    const hit=voices.find(v=>v.lang.replace('_','-').toLowerCase().startsWith(c));
    if(hit)return hit;
  }
  return null;
}

function stopVoice(){
  voiceState.aborted=true;
  if('speechSynthesis' in window)speechSynthesis.cancel();
  if(voiceState.audio){try{voiceState.audio.pause();voiceState.audio.src=''}catch(e){}voiceState.audio=null}
  if(voiceState.timer){clearInterval(voiceState.timer);voiceState.timer=null}
  voiceState.playing=false;
  voiceState.wordIdx=-1;
  document.querySelectorAll('.kword.on').forEach(el=>el.classList.remove('on'));
  document.querySelectorAll('.icb.speaking').forEach(el=>el.classList.remove('speaking'));
}

function chunkText(text,maxLen=160){
  const parts=text.split(/(?<=[।.!?])\s+/);
  const chunks=[];let cur='';
  for(const p of parts){
    if((cur+' '+p).trim().length<=maxLen){cur=(cur+' '+p).trim()}
    else{if(cur)chunks.push(cur);cur=p.slice(0,maxLen)}
  }
  if(cur)chunks.push(cur);
  return chunks.length?chunks:[text.slice(0,maxLen)];
}

function speakCloudTTS(text,lang,rate,words,onProgress,onDone){
  const tl=TTS_CODE[lang]||'hi';
  const chunks=chunkText(text,160);
  let ci=0,wi=0;
  voiceState.playing=true;
  const estMs=Math.max(190,Math.round((text.length*58)/(words.length||1)/rate));
  voiceState.timer=setInterval(()=>{if(wi<words.length){onProgress(wi);wi++}},estMs);

  function nextChunk(){
    if(voiceState.aborted)return;
    if(ci>=chunks.length){stopVoice();onDone('cloud');return}
    const q=encodeURIComponent(chunks[ci++]);
    const audio=new Audio(`https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=${tl}&q=${q}`);
    audio.referrerPolicy='no-referrer';
    audio.playbackRate=rate;
    voiceState.audio=audio;
    audio.onended=()=>nextChunk();
    audio.onerror=()=>{
      stopVoice();
      speakSilentKaraoke(words,rate,onProgress,onDone);
      toast(`No ${L[lang].e} voice offline. Read highlighted text or record a voice note.`);
    };
    audio.play().catch(()=>{
      stopVoice();
      speakSilentKaraoke(words,rate,onProgress,onDone);
    });
  }
  nextChunk();
}

function speakText(text,lang,opts={}){
  stopVoice();
  voiceState.aborted=false;
  const onDone=opts.onEnd||(()=>{});
  const onProgress=opts.onWord||(()=>{});
  const words=text.split(/\s+/).filter(Boolean);
  const rate=db.voiceRate||0.92;
  const pitch=db.voicePitch||1.0;

  if(opts.audioData){
    try{
      const audio=new Audio(opts.audioData);
      voiceState.audio=audio;
      voiceState.playing=true;
      let wi=0;
      const stepMs=Math.max(180,Math.round(320/rate));
      voiceState.timer=setInterval(()=>{if(wi<words.length){onProgress(wi);wi++}},stepMs);
      audio.onended=()=>{stopVoice();onDone('custom')};
      audio.onerror=()=>{stopVoice();speakCloudTTS(text,lang,rate,words,onProgress,onDone)};
      audio.play().catch(()=>speakCloudTTS(text,lang,rate,words,onProgress,onDone));
      return;
    }catch(e){}
  }

  const osVoice=findOSVoice(lang);
  if('speechSynthesis' in window && osVoice){
    const u=new SpeechSynthesisUtterance(text);
    u.voice=osVoice;
    u.lang=osVoice.lang||L[lang].code;
    u.rate=rate;
    u.pitch=pitch;
    voiceState.playing=true;
    let wi=0;
    const estMs=Math.max(190,Math.round((text.length*55)/(words.length||1)/rate));
    voiceState.timer=setInterval(()=>{if(wi<words.length){onProgress(wi);wi++}},estMs);
    u.onboundary=e=>{
      if(e.name==='word'){
        const before=text.slice(0,e.charIndex).trim();
        const idx=before?before.split(/\s+/).length:0;
        if(idx<words.length){wi=idx;onProgress(idx)}
      }
    };
    u.onend=()=>{stopVoice();onDone('os')};
    u.onerror=()=>{stopVoice();speakCloudTTS(text,lang,rate,words,onProgress,onDone)};
    speechSynthesis.speak(u);
    return;
  }

  // Tier 2: Real Cloud Spoken TTS Audio Stream in the selected language (no sine-wave beeps)
  speakCloudTTS(text,lang,rate,words,onProgress,onDone);
}

function speakSilentKaraoke(words,rate,onProgress,onDone){
  voiceState.playing=true;
  voiceState.aborted=false;
  let wi=0;
  const stepMs=Math.max(170,Math.round(340/rate));
  onProgress(0);wi=1;
  voiceState.timer=setInterval(()=>{
    if(wi>=words.length){stopVoice();onDone('text');return}
    onProgress(wi);
    wi++;
  },stepMs);
}

function renderKaraoke(id,text){
  return `<div class="karaoke" id="${id}">${text.split(/\s+/).filter(Boolean).map((w,i)=>`<span class="kword" data-wi="${i}">${w}</span>`).join(' ')}</div>`;
}

  if(el)el.classList.add('on');
}

async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const canon=t=>JSON.stringify([t.id,t.work,t.wage,t.per,t.days,t.lang,t.ts,t.pd,t.empName||'',t.wrkName||'']);
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const ALG={name:'ECDSA',namedCurve:'P-256'},SG={name:'ECDSA',hash:'SHA-256'},enc=x=>new TextEncoder().encode(x);
async function mk(){const k=await crypto.subtle.generateKey(ALG,true,['sign','verify']);return{pub:await crypto.subtle.exportKey('jwk',k.publicKey),prv:await crypto.subtle.exportKey('jwk',k.privateKey)}}
async function sig(prv,h){const k=await crypto.subtle.importKey('jwk',prv,ALG,false,['sign']);return b64(await crypto.subtle.sign(SG,k,enc(h)))}
async function chk(pub,sg,h){try{const k=await crypto.subtle.importKey('jwk',pub,ALG,false,['verify']);return await crypto.subtle.verify(SG,k,Uint8Array.from(atob(sg),c=>c.charCodeAt(0)),enc(h))}catch(e){return false}}

const pics=h=>[0,2,4].map(i=>EM[parseInt(h[i],16)]).join(' ');

  const hash=await sha(canon(t));

async function workerSignOffer(idx){

  if(!offerHeard[c.terms.id]){toast('Please listen to the voice summary first');return}
  const Wkeys=await mk();

  });

function fundEscrow(idx,daysCount){
  const c=db.c[idx],a=daysCount*dayAmt(c.terms);
  if(db.w.e<a){toast('Insufficient Employer wallet balance. Top up first.');return}
  db.w.e-=a;c.esc.lock+=a;
  tx('fund',a,`${c.terms.id} · ${daysCount}d escrow`);
  saveDB();render();toast(`${inr(a)} locked in escrow`);
}

function reclaimEscrow(idx){
  const c=db.c[idx],e=c.esc,reserve=c.status==='active'?3*dayAmt(c.terms):0;
  const spare=e.lock-held(e)-reserve;
  if(spare<=0){toast('3-day worker protection reserve must remain locked');return}
  e.lock-=spare;db.w.e+=spare;
  tx('refund',spare,`${c.terms.id} · Reclaimed`);
  saveDB();render();toast(`${inr(spare)} returned to Employer wallet`);
}

function workerCheckIn(idx){
  const c=db.c[idx],t=c.terms,e=c.esc;
  let amt=dayAmt(t),note='Daily shift';
  if(t.per==='piece'){
    const qty=Math.max(1,parseInt(pieceInputs[t.id]||10,10));
    amt=qty*t.wage;
    note=`${qty} pcs × ${inr(t.wage)}`;
  }
  if(t.per!=='piece'&&e.days.some(d=>d.d===dkey()&&d.st!=='refunded')){
    toast('Already checked in for today');return;
  }
  e.days.push({d:dkey(),st:'pending',at:nowD(),amt,note});
  saveDB();render();
  toast('Work logged! Pays on employer approval or auto-releases in 24h');
}

async function addChainEvent(idx,k,ok,amt){
  const c=db.c[idx],prev=c.ev.length?c.ev[c.ev.length-1].hash:c.hash,ts=new Date(nowD()).toISOString();
  c.ev.push({k,ok:!!ok,amt,ts,hash:await sha(prev+k+!!ok+amt+ts)});
}

async function settleDay(idx,j,auto){
  const c=db.c[idx],e=c.esc,d=e.days[j];
  if(!d||d.st!=='pending')return false;
  if(e.lock<d.amt){
    if(!auto)toast('Not enough funds locked in escrow. Lock funds first.');
    return false;
  }
  e.lock-=d.amt;
  d.st=auto?'auto':'paid';
  db.w.k+=d.amt;
  tx('pay',d.amt,`${c.terms.id}${auto?' · 24h Auto-Release':' · Approved'}`);
  await addChainEvent(idx,'p',1,d.amt);
  await addChainEvent(idx,'a',1,c.ev.length-1);
  saveDB();
  if(!auto)speakText(`${d.amt} ${L[c.terms.lang].ui.approve}`,c.terms.lang);
  return true;
}

}

async function sweepAutoPay(){
  if(!db)return;
  let changed=false;
  for(let i=0;i<db.c.length;i++){
    const c=db.c[i];if(c.status!=='active')continue;
    for(let j=0;j<c.esc.days.length;j++){
      const d=c.esc.days[j];
      if(d.st==='pending'&&nowD()-d.at>=864e5){
        if(await settleDay(i,j,true))changed=true;
      }
    }
  }
  if(changed)render();
}

async function verifyContract(idx){
  const c=db.c[idx];
  const termsOk=await sha(canon(c.terms))===c.hash;
  let prev=c.hash,chainOk=true;
  for(const e of c.ev){if(await sha(prev+e.k+e.ok+e.amt+e.ts)!==e.hash){chainOk=false;break}prev=e.hash}
  const eSigOk=!!c.sig.e&&await chk(c.sig.e.pub,c.sig.e.s,c.hash);
  const wSigOk=c.status==='offer'?true:(!!c.sig.w&&await chk(c.sig.w.pub,c.sig.w.s,c.hash));
  const el=document.getElementById('ver-'+idx);
  if(!el)return;
  if(termsOk&&chainOk&&eSigOk&&wSigOk){
    el.innerHTML=`<span class="pill ok">${I('check')}Verified: Terms, Chain &amp; Dual ECDSA Signatures Intact</span>`;
  }else{
    el.innerHTML=`<span class="pill bad">${I('alert')}Tamper Detected: ${!termsOk?'Terms altered':!chainOk?'Event chain broken':'Signature mismatch'}</span>`;

/* ==========================================================================
   TRUST & STATS
   ========================================================================== */
function calcStats(){
  let ok=0,late=0,finalN=0;
  db.c.forEach(c=>{
    if(c.status==='active'&&nowD()>=c.until){
      finalN++;
      c.ev.forEach((e,j)=>{
        if(e.k!=='p')return;
        const a=c.ev.find(x=>x.k==='a'&&x.amt===j);
        if(!a||!a.ok)return;
        e.ok?ok++:late++;
      });
    }
  });
  const pts=finalN*20+ok*10-late*5;
  const tiers=[['New',0],['Building',20],['Reliable',60],['Trusted',120]];
  let t=0;tiers.forEach((x,i)=>{if(pts>=x[1])t=i});
  return{ok,late,finalN,pts,t,tiers,rate:ok+late?Math.round(ok/(ok+late)*100):100};
}

function toggleVoiceRecord(onSaved){
  if(recState.recording&&recState.recorder){recState.recorder.stop();return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('Microphone not available in this browser');return}
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    recState.chunks=[];
    const mr=new MediaRecorder(stream);
    recState.recorder=mr;recState.recording=true;render();
    mr.ondataavailable=e=>{if(e.data.size>0)recState.chunks.push(e.data)};
    mr.onstop=()=>{
      stream.getTracks().forEach(t=>t.stop());
      recState.recording=false;
      const blob=new Blob(recState.chunks,{type:'audio/webm'});
      const r=new FileReader();
      r.onloadend=()=>{onSaved(r.result);toast('Human voice summary attached!');render()};
      r.readAsDataURL(blob);
    };
    mr.start();
  }).catch(()=>toast('Microphone permission denied'));
}

  </div>
  <div class="card"><div class="ct"><span class="chip">${I('clock')}</span><h2>Escrow &amp; Deposit Ledger</h2></div>
    ${own.length?own.map(x=>`<div class="drow"><div><b>${inr(x.amt)}</b> · ${x.k==='topup'?'UPI Deposit':x.k==='fund'?'Locked in Escrow':'Reclaimed'}<span>${x.note} · ${new Date(x.ts).toLocaleDateString()}</span></div></div>`).join(''):'<p class="sub">No transactions yet.</p>'}
  </div>`;
}

function renderContractCard(c,i,role){
  const t=c.terms,cl=L[db.lang],w=cl.work[t.work],open=nowD()<c.until&&c.status==='active';
  const a=dayAmt(t),sec=a?Math.max(0,Math.floor((c.esc.lock-held(c.esc))/a)):0;
  const stPill=c.status==='offer'?`<span class="pill warn">Pending Worker Sign</span>`:c.status==='withdrawn'?`<span class="pill bad">Cancelled</span>`:open?`<span class="pill wait">24h Cancel Window</span>`:`<span class="pill ok">Sealed &amp; Final</span>`;

  return`<article class="tk">
    <div class="tkh"><span class="chip">${I(w[0])}</span><div><div class="tkt">${w[1]} · ${role==='employer'?(t.wrkName||'Worker'):(t.empName||'Employer')}</div><div class="tks">${t.id} · ${inr(t.wage)} ${cl.per[t.per]} · ${cl.q[t.pd??0]}</div></div>${stPill}</div>
    <div class="tkb">
      <div class="tkl">
        <div class="dys">${DAYS.map((d,x)=>`<i class="${t.days.includes(x)?'on':''}">${d}</i>`).join('')}</div>
        <div class="emoji-fp">Symbols: ${pics(c.hash)}</div>
        <div class="hash">SHA-256 ${c.hash.slice(0,26)}…</div>
        <div id="ver-${i}" style="margin-top:6px"></div>
      </div>
      <div class="qr" data-i="${i}"></div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 12px">
      <button class="btn sm ghost" onclick="verifyContract(${i})">${I('search')}Verify</button>
      <button class="btn sm ghost" onclick="speakText('${cl.sum(w[1],t.wage,cl.per[t.per],t.days.length,t.pd).replace(/'/g,"\\'")}','${db.lang}',{audioData:${c.voiceClip?`'${c.voiceClip}'`:'null'}})">${I('speaker')}${cl.ui.listen}</button>
      <button class="btn sm ghost" onclick="openPack(${i})">${I('file')}Audit Pack</button>
      ${role==='employer'?`<button class="btn sm bad" onclick="tamperDemo(${i})">${I('alert')}Test Tamper</button>`:''}
      ${role==='worker'&&open?`<button class="btn sm bad" onclick="workerCancel(${i})">${I('undo')}Cancel (24h)</button>`:''}
    </div>
    ${c.status==='active'?`<div class="esc-box">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px">
        <div><b style="font:900 20px var(--dp)">${inr(c.esc.lock)}</b> <span style="font-size:12.5px;color:var(--mute)">locked in escrow</span></div>
        <span class="pill ${sec>=3?'ok':sec>0?'warn':'bad'}">${I('lock')}${sec} days secured</span>
      </div>
      ${role==='employer'?`<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px">
        <button class="btn sm emp" onclick="fundEscrow(${i},1)">Lock 1 Day (${inr(a)})</button>
        <button class="btn sm emp" onclick="fundEscrow(${i},${t.days.length})">Lock 1 Week (${inr(a*t.days.length)})</button>
        <button class="btn sm ghost" onclick="reclaimEscrow(${i})">Reclaim Spare</button>
      </div>`:`<div style="display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:8px">
        ${t.per==='piece'?`<input class="inp" type="number" min="1" style="width:86px;padding:6px 9px" value="${pieceInputs[t.id]||10}" oninput="pieceInputs['${t.id}']=this.value" aria-label="Piece count">`:''}
        <button class="btn sm" onclick="workerCheckIn(${i})">${I('check')}${cl.ui.worked}${t.per==='piece'?' (Pieces)':''}</button>
      </div>`}
      ${[...c.esc.days].map((d,j)=>[d,j]).reverse().slice(0,4).map(([d,j])=>`<div class="drow">
        <div><b>${d.d}</b> · ${inr(d.amt)} <span>${d.note||''}${d.st==='pending'?' · Auto-releases in '+Math.max(1,Math.ceil((d.at+864e5-nowD())/36e5))+'h':''}</span></div>
        ${d.st==='pending'&&role==='employer'?`<div style="display:flex;gap:6px"><button class="btn sm emp" onclick="settleDay(${i},${j},false).then(()=>render())">Approve &amp; Pay</button><button class="btn sm bad" onclick="disputeDay(${i},${j})">Dispute</button></div>`:`<span class="pill ${d.st==='paid'||d.st==='auto'?'ok':d.st==='disputed'?'bad':'wait'}">${d.st==='auto'?'Auto-Paid (24h)':d.st==='paid'?'Paid':d.st==='disputed'?'Disputed':'Waiting Approval'}</span>`}
      </div>`).join('')}
    </div>`:''}
  </article>`;
}

/* ==========================================================================
   MASTER RENDER
   ========================================================================== */
function render(){
  if(!db)return;
  const l=L[db.lang];
  const isEmp=db.role==='employer';
  document.getElementById('shell').className=`shell ${isEmp?'role-emp':''}`;

  $('#topbar').innerHTML=`<div class="topbar-in">
    <div class="brand" onclick="db.role=null;saveDB();render()" style="cursor:pointer">${LOGO}Saboot <small>23 Voices</small></div>
    <div class="top-ctrls">
      ${authState.user?`<span class="user-pill">${I(db.role==='employer'?'brief':'user')}${authState.user.name} (${authState.user.phone})</span><button class="top-btn" onclick="logoutUser()">Switch / Sign Out</button>`:`<div class="role-sw">
        <button class="w-active" aria-pressed="${authState.role==='worker'}" onclick="authState.role='worker';authState.otpSent=false;render()">${I('user')}${l.ui.wrk}</button>
        <button class="e-active" aria-pressed="${authState.role==='employer'}" onclick="authState.role='employer';authState.otpSent=false;render()">${I('brief')}${l.ui.emp}</button>
      </div>`}
      <button class="top-btn" onclick="openLangModal()">${I('globe')}${l.n}</button>
      <button class="top-btn" onclick="theme()" aria-label="Toggle theme">${I('moon')}</button>
    </div>
  </div>`;

  if(!db.role){
    $('#sidebar').innerHTML='';
    $('#bnav').innerHTML='';
    $('#workspace').style.gridTemplateColumns='1fr';
    $('#app').innerHTML=renderOnboarding();
    return;
  }

  $('#workspace').style.gridTemplateColumns='';
  const offersCount=db.c.filter(c=>c.status==='offer').length;
  const pendingCount=db.c.reduce((n,c)=>n+c.esc.days.filter(d=>d.st==='pending'||d.st==='disputed').length,0);

  const navItems=isEmp?[
    ['roster','shield',l.ui.roster,0],
    ['create','plus',l.ui.create,0],
    ['approve','check','Approvals',pendingCount],
    ['bizwal','wallet',l.ui.wallet,0]
  ]:[
    ['work','brief','My Work',0],
    ['sign','file',l.ui.offers,offersCount],
    ['pay','wallet',l.ui.wallet,0],
    ['trust','award',l.ui.trust,0]
  ];

  $('#sidebar').innerHTML=`<div class="nav-card">${navItems.map(([k,ic,lbl,b])=>`<button class="nav-btn" aria-current="${tab===k}" onclick="tab='${k}';render()">${I(ic)}<span>${lbl}</span>${b?`<span class="nav-badge">${b}</span>`:''}</button>`).join('')}</div>
  <div class="role-banner"><b>${isEmp?'Employer Mode':'Employee Mode'}</b><span>${isEmp?'Manage your workforce, fund wage escrow, and approve daily work.':'Listen to offers in your language, log workdays, and build portable trust.'}</span></div>`;

  $('#bnav').innerHTML=navItems.map(([k,ic,lbl,b])=>`<button aria-current="${tab===k}" onclick="tab='${k}';render()">${I(ic)}<span>${lbl}</span>${b?`<span class="nbadge">${b}</span>`:''}</button>`).join('');

  $('#app').innerHTML=isEmp?renderEmployerUI():renderWorkerUI();

  document.querySelectorAll('.qr').forEach(d=>{
    const c=db.c[+d.dataset.i];if(!c)return;
    try{const q=qrcode(0,'M');q.addData(`saboot:${c.terms.id}:${c.hash.slice(0,16)}`);q.make();d.innerHTML=q.createSvgTag(3,0)}catch(e){d.textContent='QR'}
  });
}

let ht;
function hs(){const b=$('#hold');if(!b)return;b.classList.add('go');ht=setTimeout(()=>{const z=calcStats();db.shares.unshift({tier:z.tiers[z.t][0],ts:new Date(nowD()).toISOString()});saveDB();render();toast('Tier shared with lender')},1200)}
function hc(){clearTimeout(ht);const b=$('#hold');b&&b.classList.remove('go')}

if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=()=>render();
detectBackend().then(async hasApi=>{
  await initSeedData();
  if(hasApi){
    try{
      const tok=localStorage.getItem('saboot_token');
      if(tok){authState.token=tok;await syncFromBackend();db.role=authState.user.role}
    }catch(e){authState.token=null}
  }
  sweepAutoPay();render();
});
setInterval(sweepAutoPay,60000);
</script>
</body>
