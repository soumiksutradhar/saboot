<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saboot — Voice, Visual &amp; Offline-First Work Agreement Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@500;700;800&family=Noto+Sans+Bengali:wght@500;700&family=Noto+Sans+Devanagari:wght@500;700&family=Noto+Sans+Gujarati:wght@500;700&family=Noto+Sans+Gurmukhi:wght@500;700&family=Noto+Sans+Kannada:wght@500;700&family=Noto+Sans+Malayalam:wght@500;700&family=Noto+Sans+Oriya:wght@500;700&family=Noto+Sans+Tamil:wght@500;700&family=Noto+Sans+Telugu:wght@500;700&family=Noto+Nastaliq+Urdu:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f6;
  --card:#ffffff;
  --ink:#0b1f3a;
  --mute:#3b4d66;
  --line:#9fb0c7;
  --soft:#e2e8f0;
  --gov-navy:#0a2e5c;
  --gov-blue:#14498c;
  --gov-saffron:#d95300;
  --gov-saffron-bg:#fff1e6;
  --gov-green:#0f6b2f;
  --gov-green-bg:#e3f5e9;
  --gov-amber:#ffd54f;
  --bad:#b91c1c;
  --bad-bg:#fde8e8;
  --bd:#0a2e5c;
  --fs:18px;
  --sans:'Mukta','Noto Sans Devanagari','Noto Sans Bengali','Noto Sans Gujarati','Noto Sans Gurmukhi','Noto Sans Oriya','Noto Sans Tamil','Noto Sans Telugu','Noto Sans Kannada','Noto Sans Malayalam','Noto Nastaliq Urdu',Arial,sans-serif;
}
:root[data-contrast="high"]{
  --bg:#000000;
  --card:#000000;
  --ink:#ffffff;
  --mute:#ffe600;
  --line:#ffffff;
  --soft:#1a1a1a;
  --gov-navy:#000000;
  --gov-blue:#000000;
  --gov-saffron:#ffff00;
  --gov-saffron-bg:#1a1a00;
  --gov-green:#00ff66;
  --gov-green-bg:#002611;
  --gov-amber:#ffff00;
  --bad:#ff5555;
  --bad-bg:#2b0000;
  --bd:#ffff00;
}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:500 1rem/1.45 var(--sans);
  -webkit-font-smoothing:antialiased;
}
button,input,select{font-family:inherit;font-size:1rem}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{
  outline:4px solid var(--gov-saffron);
  outline-offset:2px;
}

/* Official Government Tricolor Ribbon & Accessibility Strip */
.tricolor{
  height:6px;
  background:linear-gradient(90deg,#ff6b00 0 33.33%,#ffffff 33.33% 66.66%,#138808 66.66% 100%);
  border-bottom:1px solid #00000022;
}
.gov-util{
  background:#061b38;
  color:#ffffff;
  padding:6px 12px;
  border-bottom:1px solid #284b7a;
}
.gov-util-in{
  max-width:780px;
  margin:0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  flex-wrap:wrap;
}
.gov-tag{
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:700;
  font-size:0.85rem;
  letter-spacing:0.3px;
}
.a11y-grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.a11y-btn{
  background:#ffffff;
  color:#061b38;
  border:2px solid #ffffff;
  border-radius:6px;
  min-width:40px;
  height:36px;
  padding:0 8px;
  font-weight:800;
  font-size:0.9rem;
  cursor:pointer;
}
.a11y-btn[aria-pressed="true"]{
  background:#ffd54f;
  color:#000000;
  border-color:#ffd54f;
}

/* Offline / Online Sync Pill */
.sync-pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  height:36px;
  padding:0 10px;
  border-radius:6px;
  border:2px solid #ffffff;
  font-weight:800;
  font-size:0.8rem;
  cursor:pointer;
}
.sync-pill.online{background:#0f6b2f;color:#ffffff;border-color:#86efac}
.sync-pill.offline{background:#b91c1c;color:#ffffff;border-color:#fca5a5}
.sync-pill.pending{background:#d95300;color:#ffffff;border-color:#ffd54f}
.sync-dot{width:9px;height:9px;border-radius:50%;background:currentColor;display:inline-block}

/* Main Header */
.topbar{
  background:var(--gov-navy);
  color:#ffffff;
  border-bottom:4px solid var(--gov-saffron);
  padding:12px;
}
.topbar-in{
  max-width:780px;
  margin:0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  background:none;
  border:2px solid transparent;
  border-radius:8px;
  color:#ffffff;
  padding:4px 6px;
  cursor:pointer;
  text-align:left;
}
.brand-title{font-size:1.45rem;font-weight:800;line-height:1.1;display:block}
.brand-sub{font-size:0.8rem;color:#ffd54f;font-weight:700;display:block}

.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lang-pill{
  background:#ffd54f;
  color:#0b1f3a;
  border:2px solid #ffffff;
  border-radius:8px;
  min-height:48px;
  padding:0 14px;
  font-weight:800;
  display:inline-flex;
  align-items:center;
  gap:8px;
  cursor:pointer;
}

/* Role Switcher Bar */
.role-bar{
  background:var(--card);
  border-bottom:2px solid var(--bd);
  padding:10px 12px;
}
.role-bar-in{
  max-width:780px;
  margin:0 auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.role-tab{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  min-height:56px;
  padding:8px 12px;
  border:2px solid var(--bd);
  border-radius:8px;
  background:var(--soft);
  color:var(--ink);
  font-weight:800;
  font-size:1.05rem;
  cursor:pointer;
}
.role-tab[aria-pressed="true"]{
  background:var(--gov-navy);
  color:#ffffff;
  border-color:var(--gov-navy);
}
:root[data-contrast="high"] .role-tab[aria-pressed="true"]{
  background:#ffff00;
  color:#000000;
}

/* Single-Column Main Container */
.main-wrap{
  max-width:780px;
  margin:0 auto;
  padding:14px 12px 98px;
}

/* Picture-First Section Banner */
.pic-banner{
  background:var(--card);
  border:2px solid var(--bd);
  border-radius:10px;
  padding:14px;
  margin-bottom:14px;
  display:flex;
  align-items:center;
  gap:14px;
}
.pic-scene{
  width:72px;
  height:72px;
  border-radius:10px;
  background:var(--soft);
  border:2px solid var(--bd);
  display:grid;
  place-items:center;
  flex:none;
}
.pic-banner h1,.pic-banner h2{
  margin:0;
  font-size:1.35rem;
  font-weight:800;
  line-height:1.2;
  flex:1;
}

/* Cards */
.card{
  background:var(--card);
  border:2px solid var(--bd);
  border-radius:10px;
  padding:16px;
  margin-bottom:16px;
}
.card-hd{
  display:flex;
  align-items:center;
  gap:12px;
  padding-bottom:12px;
  margin-bottom:12px;
  border-bottom:2px solid var(--soft);
}
.card-hd h2{
  margin:0;
  font-size:1.2rem;
  font-weight:800;
  flex:1;
}
.badge-pic{
  width:52px;
  height:52px;
  border-radius:8px;
  background:var(--soft);
  border:2px solid var(--bd);
  display:grid;
  place-items:center;
  flex:none;
}

/* Large Accessible Buttons */
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  min-height:56px;
  padding:10px 18px;
  border:2px solid var(--bd);
  border-radius:8px;
  background:var(--gov-navy);
  color:#ffffff;
  font-weight:800;
  font-size:1.05rem;
  cursor:pointer;
  text-decoration:none;
}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.btn.speak{background:#ff6b00;color:#000000;border-color:#0b1f3a}
.btn.green{background:var(--gov-green);color:#ffffff;border-color:#0b1f3a}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:48px;padding:8px 14px;font-size:0.95rem}
.btn.full{width:100%}

.speak-sq{
  width:54px;
  height:54px;
  border-radius:8px;
  border:2px solid #0b1f3a;
  background:#ff6b00;
  color:#000000;
  display:grid;
  place-items:center;
  cursor:pointer;
  flex:none;
}
.speak-sq.speaking{background:#ffd54f;outline:4px solid #0b1f3a}

/* Visual Summary Strip */
.pic-eq{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  background:var(--soft);
  border:2px solid var(--bd);
  border-radius:8px;
  padding:10px;
  margin:10px 0;
}
.eq-cell{
  background:var(--card);
  border:2px solid var(--line);
  border-radius:8px;
  padding:8px 4px;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
}
.eq-cell strong{font-size:1.1rem;font-weight:800;line-height:1.1}
.eq-cell span{font-size:0.8rem;font-weight:700;color:var(--mute)}

/* Status Badges */
.status-tag{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 12px;
  border-radius:6px;
  font-weight:800;
  font-size:0.9rem;
  border:2px solid currentColor;
}
.status-tag.ok{background:var(--gov-green-bg);color:var(--gov-green)}
.status-tag.warn{background:var(--gov-saffron-bg);color:var(--gov-saffron)}
.status-tag.bad{background:var(--bad-bg);color:var(--bad)}
.status-tag.wait{background:var(--soft);color:var(--ink)}

/* KPI Visual Boxes */
.kpis{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:14px;
}
.kpi{
  background:var(--card);
  border:2px solid var(--bd);
  border-radius:8px;
  padding:12px 8px;
  text-align:center;
}
.kpi b{display:block;font-size:1.5rem;font-weight:800;margin-top:4px}
.kpi span{display:block;font-size:0.85rem;font-weight:700;color:var(--mute)}

/* Work Tiles */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{
  background:var(--card);
  border:2px solid var(--bd);
  border-radius:8px;
  padding:12px 6px;
  text-align:center;
  font-weight:800;
  color:var(--ink);
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  min-height:104px;
}
.tile[aria-pressed="true"]{
  background:var(--gov-navy);
  color:#ffffff;
}

.seg{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-bottom:12px;
}
.seg button{
  min-height:52px;
  border:2px solid var(--bd);
  border-radius:8px;
  background:var(--card);
  color:var(--ink);
  font-weight:800;
  cursor:pointer;
}
.seg button[aria-pressed="true"]{
  background:var(--gov-navy);
  color:#ffffff;
}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chips button{
  min-height:48px;
  padding:0 16px;
  border:2px solid var(--bd);
  border-radius:8px;
  background:var(--card);
  color:var(--ink);
  font-weight:800;
  cursor:pointer;
}
.chips button[aria-pressed="true"]{
  background:var(--gov-navy);
  color:#ffffff;
}

.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0}
.days button{
  min-height:48px;
  border-radius:8px;
  border:2px solid var(--bd);
  background:var(--card);
  color:var(--ink);
  font-weight:800;
  cursor:pointer;
}
.days button[aria-pressed="true"]{
  background:var(--gov-green);
  color:#ffffff;
}

.inp{
  width:100%;
  min-height:52px;
  border:2px solid var(--bd);
  background:var(--card);
  color:var(--ink);
  border-radius:8px;
  padding:10px 12px;
  font-weight:700;
}
.amt-big{font-size:2.6rem;font-weight:800;text-align:center;margin:8px 0}

/* Karaoke Box */
.karaoke{
  background:var(--soft);
  border:2px solid var(--bd);
  border-radius:8px;
  padding:12px;
  margin:12px 0;
  font-size:1.1rem;
  line-height:1.65;
  font-weight:700;
}
.kword{display:inline-block;padding:2px 4px;border-radius:4px}
.kword.on{background:#ffd54f;color:#000000}

/* Contract Ticket */
.tk{
  background:var(--card);
  border:3px solid var(--bd);
  border-radius:10px;
  margin-bottom:16px;
  overflow:hidden;
}
.tkh{
  display:flex;
  gap:10px;
  align-items:center;
  padding:12px 14px;
  background:var(--gov-navy);
  color:#ffffff;
  flex-wrap:wrap;
}
.tkh .tkt{font-size:1.2rem;font-weight:800}
.tkh .tks{font-size:0.9rem;color:#ffd54f;font-weight:700}
.tkb{padding:14px}
.qr-box{
  display:inline-flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  background:#ffffff;
  color:#000000;
  border:2px solid #0b1f3a;
  border-radius:8px;
  padding:6px;
  cursor:pointer;
}
.qr-box svg{display:block;width:96px;height:96px}
.qr-cap{font-size:0.75rem;font-weight:800;color:#0b1f3a}

.dys{display:flex;gap:4px;justify-content:center}
.dys i{
  width:22px;height:22px;border-radius:4px;
  display:grid;place-items:center;
  font-size:0.75rem;font-weight:800;font-style:normal;
  background:var(--soft);color:var(--mute);border:1px solid var(--line);
}
.dys i.on{background:var(--gov-green);color:#ffffff;border-color:var(--gov-green)}

.shape-match{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:var(--soft);
  border:2px solid var(--bd);
  border-radius:8px;
  padding:6px 10px;
  font-weight:800;
}

.esc-box{
  margin:12px 0 0;
  border:2px solid var(--gov-green);
  border-radius:8px;
  padding:12px;
  background:var(--gov-green-bg);
}
.drow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  padding:10px 0;
  border-top:2px solid var(--line);
  flex-wrap:wrap;
}

/* Bottom Government Navigation Bar */
.bnav{
  position:fixed;
  bottom:0;left:0;right:0;
  z-index:25;
  background:var(--card);
  border-top:3px solid var(--bd);
  padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px);
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}
.bnav button{
  border:2px solid transparent;
  background:none;
  color:var(--ink);
  font-weight:800;
  font-size:0.85rem;
  min-height:62px;
  padding:4px 2px;
  border-radius:8px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  cursor:pointer;
  position:relative;
}
.bnav button[aria-current="true"]{
  background:var(--gov-navy);
  color:#ffffff;
  border-color:var(--gov-navy);
}
.bnav .nbadge{
  position:absolute;
  top:2px;right:12%;
  background:#d95300;
  color:#ffffff;
  font-size:0.75rem;
  font-weight:800;
  padding:1px 6px;
  border-radius:99px;
}

/* Modal & Onboarding */
.modal{
  position:fixed;inset:0;
  background:#000000b8;
  display:grid;place-items:center;
  padding:12px;z-index:40;
}
.modal .card{max-width:680px;width:100%;max-height:88vh;overflow:auto;margin:0}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin:12px 0}
.lbtn{
  border:2px solid var(--bd);
  background:var(--card);
  color:var(--ink);
  border-radius:8px;
  padding:10px;
  text-align:left;
  cursor:pointer;
  min-height:58px;
}
.lbtn[aria-pressed="true"]{background:var(--gov-navy);color:#ffffff}
.lbtn strong{display:block;font-size:1.1rem}
.lbtn small{font-size:0.8rem;opacity:0.85}

.onboard{display:grid;grid-template-columns:1fr;gap:16px}
.rcard{
  background:var(--card);
  border:3px solid var(--bd);
  border-radius:10px;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.step-strip{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  background:var(--soft);
  padding:10px;
  border-radius:8px;
  border:2px solid var(--line);
}
.step-item{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:6px;
  padding:8px 4px;
  text-align:center;
  font-weight:800;
  font-size:0.85rem;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}

.toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%);
  background:#061b38;color:#ffffff;border:3px solid #ffd54f;
  padding:12px 18px;border-radius:8px;font-weight:800;
  z-index:50;max-width:92vw;text-align:center;
}

/* Printable Official Agreement Sheet */
#print-sheet{display:none}
@media print{
  body *{visibility:hidden}
  #print-sheet,#print-sheet *{visibility:visible}
  #print-sheet{
    display:block !important;
    position:fixed;
    left:0;top:0;width:100%;
    background:#ffffff;
    color:#000000;
    padding:20px;
    font-family:Arial,sans-serif;
  }
  .ps-box{border:2px solid #0a2e5c;padding:18px;border-radius:8px}
  .ps-hdr{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #0a2e5c;padding-bottom:12px;margin-bottom:14px}
  .ps-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
  .ps-cell{border:1px solid #9fb0c7;padding:8px;border-radius:6px}
  .ps-hash{font-family:monospace;font-size:11px;word-break:break-all;background:#f1f5f9;padding:8px;border:1px solid #cbd5e1;margin-top:8px}
}

@media (max-width:540px){
  .pic-eq{grid-template-columns:repeat(2,1fr)}
  .grid3{grid-template-columns:repeat(2,1fr)}
  .kpis{grid-template-columns:1fr}
}
</style>
</head>

const QR_GF=(()=>{
  const exp=new Uint8Array(512),log=new Uint8Array(256);
  let x=1;
  for(let i=0;i<255;i++){exp[i]=x;log[x]=i;x<<=1;if(x&0x100)x^=0x11d;}
  for(let i=255;i<512;i++)exp[i]=exp[i-255];
  return{exp,log};
})();
function qrMul(a,b){return(a===0||b===0)?0:QR_GF.exp[QR_GF.log[a]+QR_GF.log[b]];}
function qrRs(data,nsym){
  let g=[1];
  for(let i=0;i<nsym;i++){
    const ng=new Array(g.length+1).fill(0);
    for(let j=0;j<g.length;j++){ng[j]^=g[j];ng[j+1]^=qrMul(g[j],QR_GF.exp[i]);}
    g=ng;
  }
  const res=data.concat(new Array(nsym).fill(0));
  for(let i=0;i<data.length;i++){
    const c=res[i];
    if(c!==0)for(let j=1;j<g.length;j++)res[i+j]^=qrMul(g[j],c);
  }
  return res.slice(data.length);
}

          let bit=bi<stream.length?stream[bi++]:0;
          if((r+cc)%2===0)bit^=1;
          mat[r][cc]=bit;
        }
      }
    }
    up=!up;col-=2;
  }

  const fmt=0x77C4;
  for(let i=0;i<6;i++)setM(8,i,(fmt>>(14-i))&1);
  setM(8,7,(fmt>>8)&1);setM(8,8,(fmt>>7)&1);setM(7,8,(fmt>>6)&1);
  for(let i=0;i<6;i++)setM(5-i,8,(fmt>>(5-i))&1);
  for(let i=0;i<7;i++)setM(size-1-i,8,(fmt>>(14-i))&1);
  for(let i=0;i<8;i++)setM(8,size-8+i,(fmt>>(7-i))&1);

  let rects='';
  for(let r=0;r<size;r++)for(let c=0;c<size;c++){
    if(mat[r][c])rects+=`<rect x="${c}" y="${r}" width="1" height="1"/>`;
  }
  return`<svg viewBox="-4 -4 ${size+8} ${size+8}" shape-rendering="crispEdges" role="img" aria-label="Contract QR Code"><rect x="-4" y="-4" width="${size+8}" height="${size+8}" fill="#ffffff"/><g fill="#000000">${rects}</g></svg>`;
}

/* ==========================================================================
   VOICE SYSTEM (23 LANGUAGES + KARAOKE HIGHLIGHT)
   ========================================================================== */
let voiceState={playing:false,timer:null,audio:null,aborted:false};
let recState={recording:false,recorder:null,chunks:[]};
const TTS_CODE={en:'en-IN',hi:'hi',od:'or',bn:'bn',mr:'mr',gu:'gu',ta:'ta',te:'te',kn:'kn',ml:'ml',pa:'pa',as:'as',ur:'ur',ne:'ne',kok:'mr',mai:'hi',sa:'sa',sd:'sd',ks:'ur',doi:'hi',mni:'bn',sat:'bn',brx:'hi'};

function findOSVoice(lang){
  if(!('speechSynthesis' in window))return null;
  const voices=speechSynthesis.getVoices();
  if(!voices.length)return null;
  const target=L[lang].code.toLowerCase();
  const p2=target.split('-')[0];
  const alt={od:['or','ory']};
  const candidates=[p2,...(alt[lang]||[])];
  const exact=voices.find(v=>v.lang.replace('_','-').toLowerCase()===target);
  if(exact)return exact;
  for(const c of candidates){
    const hit=voices.find(v=>v.lang.replace('_','-').toLowerCase().startsWith(c));
    if(hit)return hit;
  }
  return null;
}

function stopVoice(){
  voiceState.aborted=true;
  if('speechSynthesis' in window)speechSynthesis.cancel();
  if(voiceState.audio){try{voiceState.audio.pause();voiceState.audio.src=''}catch(e){}voiceState.audio=null;}
  if(voiceState.timer){clearInterval(voiceState.timer);voiceState.timer=null;}
  voiceState.playing=false;
  document.querySelectorAll('.kword.on').forEach(el=>el.classList.remove('on'));
}

function chunkText(text,maxLen=160){
  const parts=text.split(/(?<=[।.!?])\s+/);
  const chunks=[];let cur='';
  for(const p of parts){
    if((cur+' '+p).trim().length<=maxLen)cur=(cur+' '+p).trim();
    else{if(cur)chunks.push(cur);cur=p.slice(0,maxLen);}
  }
  if(cur)chunks.push(cur);
  return chunks.length?chunks:[text.slice(0,maxLen)];
}

function speakCloudTTS(text,lang,rate,words,onProgress,onDone){
  const tl=TTS_CODE[lang]||'hi';
  const chunks=chunkText(text,160);
  let ci=0,wi=0;
  voiceState.playing=true;
  const estMs=Math.max(190,Math.round((text.length*58)/(words.length||1)/rate));
  voiceState.timer=setInterval(()=>{if(wi<words.length){onProgress(wi);wi++;}},estMs);

  function nextChunk(){
    if(voiceState.aborted)return;
    if(ci>=chunks.length){stopVoice();onDone('cloud');return;}
    const q=encodeURIComponent(chunks[ci++]);
    const audio=new Audio(`/api/tts?lang=${encodeURIComponent(lang)}&q=${q}`);
    audio.playbackRate=rate;
    voiceState.audio=audio;
    audio.onended=()=>nextChunk();
    audio.onerror=()=>{stopVoice();speakSilentKaraoke(words,rate,onProgress,onDone);};
    audio.play().catch(()=>{stopVoice();speakSilentKaraoke(words,rate,onProgress,onDone);});
  }
  nextChunk();
}

function speakSilentKaraoke(words,rate,onProgress,onDone){
  voiceState.playing=true;voiceState.aborted=false;
  let wi=0;
  const stepMs=Math.max(180,Math.round(340/rate));
  onProgress(0);wi=1;
  voiceState.timer=setInterval(()=>{
    if(wi>=words.length){stopVoice();onDone('text');return;}
    onProgress(wi);wi++;
  },stepMs);
}

function speakText(text,lang,opts={}){
  stopVoice();
  voiceState.aborted=false;
  const onDone=opts.onEnd||(()=>{});
  const onProgress=opts.onWord||(()=>{});
  const words=text.split(/\s+/).filter(Boolean);
  const rate=db.voiceRate||0.9;

  if(opts.audioData){
    try{
      const audio=new Audio(opts.audioData);
      voiceState.audio=audio;voiceState.playing=true;
      let wi=0;
      const stepMs=Math.max(180,Math.round(320/rate));
      voiceState.timer=setInterval(()=>{if(wi<words.length){onProgress(wi);wi++;}},stepMs);
      audio.onended=()=>{stopVoice();onDone('custom');};
      audio.onerror=()=>{stopVoice();speakCloudTTS(text,lang,rate,words,onProgress,onDone);};
      audio.play().catch(()=>speakCloudTTS(text,lang,rate,words,onProgress,onDone));
      return;
    }catch(e){}
  }

  const osVoice=findOSVoice(lang);
  if('speechSynthesis' in window&&osVoice){
    const u=new SpeechSynthesisUtterance(text);
    u.voice=osVoice;u.lang=osVoice.lang||L[lang].code;u.rate=rate;
    voiceState.playing=true;
    let wi=0;
    const estMs=Math.max(190,Math.round((text.length*55)/(words.length||1)/rate));
    voiceState.timer=setInterval(()=>{if(wi<words.length){onProgress(wi);wi++;}},estMs);
    u.onboundary=e=>{
      if(e.name==='word'){
        const before=text.slice(0,e.charIndex).trim();
        const idx=before?before.split(/\s+/).length:0;
        if(idx<words.length){wi=idx;onProgress(idx);}
      }
    };
    u.onend=()=>{stopVoice();onDone('os');};
    u.onerror=()=>{stopVoice();speakCloudTTS(text,lang,rate,words,onProgress,onDone);};
    speechSynthesis.speak(u);
    return;
  }
  speakCloudTTS(text,lang,rate,words,onProgress,onDone);
}

async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const canon=t=>JSON.stringify([t.id,t.work,t.wage,t.per,t.days,t.lang,t.ts,t.pd,t.empName||'',t.wrkName||'']);
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const ALG={name:'ECDSA',namedCurve:'P-256'},SG={name:'ECDSA',hash:'SHA-256'},enc=x=>new TextEncoder().encode(x);
async function mk(){const k=await crypto.subtle.generateKey(ALG,true,['sign','verify']);return{pub:await crypto.subtle.exportKey('jwk',k.publicKey),prv:await crypto.subtle.exportKey('jwk',k.privateKey)}}
async function sig(prv,h){const k=await crypto.subtle.importKey('jwk',prv,ALG,false,['sign']);return b64(await crypto.subtle.sign(SG,k,enc(h)))}
async function chk(pub,sg,h){try{const k=await crypto.subtle.importKey('jwk',pub,ALG,false,['verify']);return await crypto.subtle.verify(SG,k,Uint8Array.from(atob(sg),c=>c.charCodeAt(0)),enc(h))}catch(e){return false}}

/* ==========================================================================
   OFFLINE-FIRST DATA SYNC ENGINE (LOCAL QUEUE + AUTO-FLUSH ON RECONNECT)
   ========================================================================== */
let simulatedOffline=false;
let isSyncing=false;

const isAppOnline=()=>!simulatedOffline && (typeof navigator==='undefined' || navigator.onLine!==false);

function enqueueSync(op,contractId,summary,payload={}){
  if(!db)return;
  if(!db.syncQueue)db.syncQueue=[];
  const packet={
    qid:'Q-'+Math.random().toString(36).slice(2,8).toUpperCase(),
    op,
    contractId:contractId||'WALLET',
    summary,
    payload,
    ts:new Date(nowD()).toISOString(),
    status:'queued'
  };
  db.syncQueue.unshift(packet);
  saveDB();
  if(isAppOnline()){
    processSyncQueue(true);
  }else{
    renderSyncStatus();
    toast(`Saved offline (${db.syncQueue.filter(x=>x.status==='queued').length} queued)`);
  }
}

async function processSyncQueue(silent=false){
  if(!db || !db.syncQueue)return;
  const pending=db.syncQueue.filter(x=>x.status==='queued');
  if(!pending.length){
    if(!silent)toast('All records already synced');
    renderSyncStatus();
    return;
  }
  if(!isAppOnline()){
    if(!silent)toast('Offline — queued locally for auto-sync');
    renderSyncStatus();
    return;
  }

  isSyncing=true;
  renderSyncStatus();

  try{
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),1800);
    try{
      await fetch('/api/sync',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({packets:pending}),
        signal:controller.signal
      });
    }catch(_e){
      await new Promise(r=>setTimeout(r,350));
    }finally{
      clearTimeout(timer);
    }

    const syncedAt=new Date().toISOString();
    pending.forEach(item=>{
      item.status='synced';
      item.syncedAt=syncedAt;
    });
    db.lastSync=syncedAt;
    db.syncQueue=db.syncQueue.slice(0,25);
    saveDB();
    if(!silent)toast(`Synced ${pending.length} offline record(s)`);
  }finally{
    isSyncing=false;
    renderSyncStatus();
    if(document.getElementById('sync-modal-body'))openSyncModal(true);
  }
}

function toggleOfflineSimulation(){
  simulatedOffline=!simulatedOffline;
  renderSyncStatus();
  if(simulatedOffline){
    toast('Offline Mode ON — actions will queue locally');
  }else{
    toast('Back Online — syncing queued records...');
    processSyncQueue(false);
  }
  if(document.getElementById('sync-modal-body'))openSyncModal(true);
}

function renderSyncStatus(){
  const mount=$('#sync-status-mount');
  if(!mount || !db)return;
  const queuedCount=(db.syncQueue||[]).filter(x=>x.status==='queued').length;
  const online=isAppOnline();
  let cls='online',label='ONLINE · SYNCED';
  if(isSyncing){
    cls='pending';label='SYNCING...';
  }else if(!online){
    cls='offline';label=`OFFLINE${queuedCount?` · ${queuedCount} QUEUED`:''}`;
  }else if(queuedCount>0){
    cls='pending';label=`${queuedCount} PENDING SYNC`;
  }
  mount.innerHTML=`<button class="sync-pill ${cls}" onclick="openSyncModal()" title="View Offline-First Sync Queue">
    <span class="sync-dot"></span>
    <span>${label}</span>
  </button>`;

    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--soft);padding:12px;border-radius:8px;border:2px solid var(--bd);margin-bottom:12px">

    `4 0 obj\n<< /Length ${stream.length} >>\nstream\n${stream}endstream\nendobj\n`,
    '5 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>\nendobj\n',
    '6 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>\nendobj\n'
  ];

  let pdf='%PDF-1.4\n';
  const offsets=[0];
  for(const obj of objects){
    offsets.push(pdf.length);
    pdf+=obj;
  }
  const xrefPos=pdf.length;
  pdf+=`xref\n0 ${objects.length+1}\n0000000000 65535 f \n`;
  for(let i=1;i<=objects.length;i++){
    pdf+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';
  }
  pdf+=`trailer\n<< /Size ${objects.length+1} /Root 1 0 R >>\nstartxref\n${xrefPos}\n%%EOF`;

  const blob=new Blob([pdf],{type:'application/pdf'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`Saboot-Contract-${t.id}.pdf`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
  toast(`Downloaded Saboot-Contract-${t.id}.pdf`);
}

async function createOffer(){
  const wage=+draft.wage;
  if(!wage||wage<=0){toast('₹ ?');return;}
  if(!draft.days.size){toast('1+ day');return;}
  const t={
    id:'SB'+Math.random().toString(36).slice(2,7).toUpperCase(),
    work:draft.work,wage,per:draft.per,days:[...draft.days].sort(),
    lang:db.lang,pd:draft.pd,ts:new Date(nowD()).toISOString(),
    empName:(draft.empName||'Employer').trim(),wrkName:(draft.wrkName||'Worker').trim()
  };
  const hash=await sha(canon(t));
  const Ekeys=await mk();
  db.c.unshift({
    terms:t,hash,until:nowD()+864e5,status:'offer',ev:[],
    esc:{lock:0,days:[]},
    sig:{e:{pub:Ekeys.pub,s:await sig(Ekeys.prv,hash)},w:null},
    voiceClip:draft.voiceClip||null
  });
  draft.voiceClip=null;
  saveDB();
  enqueueSync('CREATE_CONTRACT',t.id,`New offer ${inr(wage)}/${t.per}`,{hash});
  toast(t.id);
  tab='roster';
  render();
}

async function workerSignOffer(idx){

function fundEscrow(idx,daysCount){

  db.w.e-=a;c.esc.lock+=a;

}

function reclaimEscrow(idx){
  const c=db.c[idx],e=c.esc,reserve=c.status==='active'?3*dayAmt(c.terms):0;
  const spare=e.lock-held(e)-reserve;
  if(spare<=0){toast('3d reserve locked');return;}
  e.lock-=spare;db.w.e+=spare;
  tx('refund',spare,c.terms.id);
  saveDB();
  enqueueSync('RECLAIM_ESCROW',c.terms.id,`Reclaimed ${inr(spare)}`,{amt:spare});
  render();toast(`+ ${inr(spare)}`);

function workerCheckIn(idx){
  const c=db.c[idx],t=c.terms,e=c.esc;
  let amt=dayAmt(t),note='1d';
  if(t.per==='piece'){
    const qty=Math.max(1,parseInt(pieceInputs[t.id]||10,10));
    amt=qty*t.wage;
    note=`${qty} × ${inr(t.wage)}`;
  }
  if(t.per!=='piece'&&e.days.some(d=>d.d===dkey()&&d.st!=='refunded')){
    toast('OK');return;
  }
  e.days.push({d:dkey(),st:'pending',at:nowD(),amt,note});
  saveDB();
  enqueueSync('SHIFT_CHECKIN',t.id,`Logged shift ${inr(amt)} (${note})`,{date:dkey(),amt});
  render();
  speakText(L[db.lang].ui.worked+' '+inr(amt),db.lang);
}

async function addChainEvent(idx,k,ok,amt){
  const c=db.c[idx],prev=c.ev.length?c.ev[c.ev.length-1].hash:c.hash,ts=new Date(nowD()).toISOString();
  c.ev.push({k,ok:!!ok,amt,ts,hash:await sha(prev+k+!!ok+amt+ts)});
}

async function settleDay(idx,j,auto){
  const c=db.c[idx],e=c.esc,d=e.days[j];
  if(!d||d.st!=='pending')return false;
  if(e.lock<d.amt){if(!auto)toast('+ ₹');return false;}
  e.lock-=d.amt;
  d.st=auto?'auto':'paid';
  db.w.k+=d.amt;
  tx('pay',d.amt,`${c.terms.id}${auto?' (24h)':''}`);
  await addChainEvent(idx,'p',1,d.amt);
  await addChainEvent(idx,'a',1,c.ev.length-1);
  saveDB();
  enqueueSync(auto?'AUTO_PAYOUT':'APPROVE_PAYOUT',c.terms.id,`Released ${inr(d.amt)}`,{amt:d.amt});
  if(!auto)speakText(`${d.amt} ${L[c.terms.lang].ui.approve}`,c.terms.lang);
  return true;
}

function disputeDay(idx,j){
  db.c[idx].esc.days[j].st='disputed';
  saveDB();
  enqueueSync('DISPUTE_SHIFT',db.c[idx].terms.id,`Disputed ${db.c[idx].esc.days[j].d}`);
  render();
}
async function resolveDispute(idx,j,payWorker){
  const c=db.c[idx],e=c.esc,d=e.days[j];
  if(payWorker){d.st='pending';await settleDay(idx,j,false);render();}
  else{
    e.lock-=d.amt;db.w.e+=d.amt;d.st='refunded';tx('refund',d.amt,c.terms.id);saveDB();
    enqueueSync('RESOLVE_REFUND',c.terms.id,`Refunded ${inr(d.amt)} to employer`);
    render();
  }
}

async function sweepAutoPay(){
  if(!db)return;
  let changed=false;
  for(let i=0;i<db.c.length;i++){
    const c=db.c[i];if(c.status!=='active')continue;
    for(let j=0;j<c.esc.days.length;j++){
      const d=c.esc.days[j];
      if(d.st==='pending'&&nowD()-d.at>=864e5){
        if(await settleDay(i,j,true))changed=true;
      }
    }
  }
  if(changed)render();
}

async function verifyContract(idx){
  const c=db.c[idx];
  const termsOk=await sha(canon(c.terms))===c.hash;
  let prev=c.hash,chainOk=true;
  for(const e of c.ev){if(await sha(prev+e.k+e.ok+e.amt+e.ts)!==e.hash){chainOk=false;break;}prev=e.hash;}
  const eSigOk=!!c.sig.e&&await chk(c.sig.e.pub,c.sig.e.s,c.hash);
  const wSigOk=c.status==='offer'?true:(!!c.sig.w&&await chk(c.sig.w.pub,c.sig.w.s,c.hash));
  const el=document.getElementById('ver-'+idx);
  if(!el)return;
  if(termsOk&&chainOk&&eSigOk&&wSigOk){
    el.innerHTML=`<span class="status-tag ok">${I('check',20)}OK · ${c.terms.id}</span>`;
  }else{
    el.innerHTML=`<span class="status-tag bad">${I('alert',20)}TAMPERED</span>`;
  }
}

function toggleVoiceRecord(onSaved){
  if(recState.recording&&recState.recorder){recState.recorder.stop();return;}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('No Mic');return;}
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    recState.chunks=[];
    const mr=new MediaRecorder(stream);
    recState.recorder=mr;recState.recording=true;render();
    mr.ondataavailable=e=>{if(e.data.size>0)recState.chunks.push(e.data);};
    mr.onstop=()=>{
      stream.getTracks().forEach(t=>t.stop());
      recState.recording=false;
      const blob=new Blob(recState.chunks,{type:'audio/webm'});
      const r=new FileReader();
      r.onloadend=()=>{onSaved(r.result);toast('OK');render();};
      r.readAsDataURL(blob);
    };
    mr.start();
  }).catch(()=>toast('Mic blocked'));
}

    <div class="card">
      <div class="card-hd"><div class="badge-pic" style="background:var(--gov-green-bg);color:var(--gov-green)">${I('check',24)}</div><h2>${l.ui.ongoing} (${active.length})</h2></div>
      ${active.length?active.map(([c,i])=>renderContractCard(c,i,'worker')).join(''):`<p style="color:var(--mute);margin:0">${l.ui.noOngoing}</p>`}
    </div>

    <div class="card">
      <div class="card-hd"><div class="badge-pic" style="background:var(--gov-saffron-bg);color:var(--gov-saffron)">${I('clock',24)}</div><h2>${l.ui.pending} (${pending.length})</h2></div>
      ${pending.length?pending.map(([c,i])=>renderContractCard(c,i,'worker')).join(''):`<p style="color:var(--mute);margin:0">${l.ui.noPending}</p>`}
    </div>

    <div class="card">
      <div class="card-hd"><div class="badge-pic" style="background:var(--soft);color:var(--ink)">${I('file',24)}</div><h2>${l.ui.completed} (${completed.length})</h2></div>
      ${completed.length?completed.map(([c,i])=>renderContractCard(c,i,'worker')).join(''):`<p style="color:var(--mute);margin:0">${l.ui.noCompleted}</p>`}
    </div>`;
  }

  if(tab==='offers'){
    return`<div class="pic-banner">
      <div class="pic-scene">${PIC('listen-sign',64)}</div>
      <h1>${l.ui.offers} (${offers.length})</h1>
    </div>
    ${offers.length?offers.map(([c,i])=>{
      const t=c.terms,cl=L[db.lang];
      const summary=cl.sum(cl.work[t.work][1],t.wage,cl.per[t.per],t.days.length,t.pd);
      const heard=!!offerHeard[t.id];
      return`<article class="tk">
        <div class="tkh">
          <div><div class="tkt">${t.empName||l.ui.emp}</div><div class="tks">${t.id}</div></div>
          <div class="shape-match" style="margin-left:auto;color:#0b1f3a">${shapeFingerprint(c.hash)}</div>
        </div>
        <div class="tkb">
          ${renderPictureEquation(c)}
          ${renderKaraoke('k-'+t.id,summary)}
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px">
            <button class="btn speak" onclick="speakText('${summary.replace(/'/g,"\\'")}','${db.lang}',{audioData:${c.voiceClip?`'${c.voiceClip}'`:'null'},onWord:(wi)=>highlightWord('k-${t.id}',wi),onEnd:()=>{offerHeard['${t.id}']=true;render();}})">${I('speaker',26)}1. ${l.ui.listen}</button>
            <button class="btn green" ${heard?'':'disabled'} onclick="workerSignOffer(${i})">${I('check',26)}2. ${l.ui.sign}</button>
          </div>
          <div style="margin-top:12px;text-align:center">
            <div class="qr-box" onclick="openQrModal(${i})" role="button" tabindex="0">
              ${makeQrSvg(`saboot:${t.id}:${c.hash.slice(0,16)}`)}
              <span class="qr-cap">${t.id}</span>
            </div>
          </div>
        </div>
      </article>`;
    }).join(''):`<div class="card" style="text-align:center"><div style="margin:8px auto">${PIC('worker',74)}</div><h2>0 ${l.ui.offers}</h2></div>`}`;
  }

  if(tab==='payments'){
    const own=db.w.tx.filter(x=>['pay','out','topup','fund','refund'].includes(x.k));
    return`<div class="pic-banner">
      <div class="pic-scene">${PIC('bank-pay',64)}</div>
      <h1>${l.ui.payments}</h1>
      <button class="speak-sq" onclick="speakText('${inr(db.w.k)}','${db.lang}')" aria-label="${l.ui.listen}">${I('speaker',26)}</button>
    </div>
    <div class="card" style="text-align:center">
      <div style="font-size:0.9rem;font-weight:700;color:var(--mute)">${l.ui.availBal}</div>
      <div class="amt-big">${inr(db.w.k)}</div>
      <button class="btn green full" ${db.w.k?'':'disabled'} onclick="const a=db.w.k;db.w.k=0;tx('out',a,'Bank');saveDB();enqueueSync('BANK_CASHOUT','WALLET','Cashed out '+inr(a),{amt:a});render();speakText(inr(a),'${db.lang}')">${I('bank',26)}${l.ui.cashout}</button>
    </div>
    <div class="card">
      <h3 style="margin-top:0">${l.ui.txHist}</h3>
      ${own.length?own.map(x=>`<div class="drow"><div><strong>${inr(x.amt)}</strong> · ${x.note}<br><small style="color:var(--mute);font-size:0.75rem">${new Date(x.ts).toLocaleDateString()}</small></div><span class="status-tag ${x.k==='pay'||x.k==='topup'||x.k==='refund'?'ok':'wait'}">${x.k==='pay'?'+ ₹':x.k==='out'?l.ui.cashout:x.k}</span></div>`).join(''):`<div style="text-align:center;color:var(--mute)">₹0</div>`}
    </div>`;
  }

  if(tab==='history'){
    const checkIns=[];
    db.c.forEach(c=>{
      if(c.esc && c.esc.days){
        c.esc.days.forEach(d=>{
          checkIns.push({id:c.terms.id, emp:c.terms.empName, work:c.terms.work, ...d});
        });
      }
    });
    return`<div class="pic-banner">
      <div class="pic-scene">${I('clock',40)}</div>
      <h1>${l.ui.history}</h1>
    </div>
    <div class="card">
      <h3 style="margin-top:0">${l.ui.shiftLog}</h3>
      ${checkIns.length?checkIns.map(ci=>`<div class="drow">
        <div>
          <strong>${ci.id} · ${ci.emp}</strong><br>
          <small style="color:var(--mute)">${ci.d} · ${ci.note}</small>
        </div>
        <div style="text-align:right">
          <strong>${inr(ci.amt)}</strong><br>
          <span class="status-tag ${ci.st==='paid'||ci.st==='auto'?'ok':ci.st==='disputed'?'bad':'wait'}">${ci.st==='paid'||ci.st==='auto'?'OK':ci.st}</span>
        </div>
      </div>`).join(''):`<div style="text-align:center;color:var(--mute)">0</div>`}
    </div>`;
  }
}

function renderEmployerUI(){
  const l=L[db.lang];
  const pendingApprovals=db.c.reduce((n,c)=>n+c.esc.days.filter(d=>d.st==='pending'||d.st==='disputed').length,0);
  const totalLocked=db.c.reduce((n,c)=>n+c.esc.lock,0);

  if(tab==='roster'){
    return`<div class="pic-banner">
      <div class="pic-scene">${PIC('employer',64)}</div>
      <h1>${l.ui.roster}</h1>
      <button class="btn green" onclick="tab='create';render()">${I('plus',24)}${l.ui.create}</button>
    </div>
    <div class="kpis">
      <div class="kpi">${I('user',26)}<b>${db.c.filter(c=>c.status==='active').length}</b><span>${l.ui.wrk}</span></div>
      <div class="kpi" style="background:var(--gov-green-bg)">${I('lock',26)}<b>${inr(totalLocked)}</b><span>₹ ${l.ui.safe}</span></div>
      <div class="kpi">${I('clock',26)}<b>${pendingApprovals}</b><span>${l.ui.approve}</span></div>
    </div>
    ${db.c.map((c,i)=>renderContractCard(c,i,'employer')).join('')}
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px">
      <button class="btn sm ghost" onclick="db.off=(db.off||0)+1;saveDB();sweepAutoPay();render();toast('+24h')">${I('clock',20)}+24h</button>
      <button class="btn sm bad" onclick="ask('Reset?',()=>{localStorage.removeItem('saboot_gov_v3');db=null;initSeedData().then(render)})">Reset</button>
    </div>`;
  }

  if(tab==='create'){
    const preview=l.sum(l.work[draft.work][1],draft.wage||0,l.per[draft.per],draft.days.size,draft.pd);
    return`<div class="pic-banner">
      <div class="pic-scene">${PIC('employer',64)}</div>
      <h1>${l.ui.create}</h1>
    </div>
    <div class="card">
      <div class="card-hd"><div class="badge-pic">${I('brief',28)}</div><h2>1. ${l.ui.wrk}</h2></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
        <input class="inp" aria-label="${l.ui.emp}" value="${draft.empName}" oninput="draft.empName=this.value">
        <input class="inp" aria-label="${l.ui.wrk}" placeholder="${l.ui.wrk}" value="${draft.wrkName}" oninput="draft.wrkName=this.value">
      </div>
      <div class="grid3">${Object.entries(l.work).map(([k,[ic,name]])=>`<button class="tile" aria-pressed="${draft.work===k}" onclick="draft.work='${k}';render()">${I(ic,34)}<span>${name}</span></button>`).join('')}</div>
    </div>

    <div class="card">
      <div class="card-hd"><div class="badge-pic">${I('rupee',28)}</div><h2>2. ₹</h2></div>
      <div class="seg">${Object.entries(l.per).map(([k,name])=>`<button aria-pressed="${draft.per===k}" onclick="draft.per='${k}';render()">${name}</button>`).join('')}</div>
      <input class="inp" type="number" min="1" style="font-size:1.5rem;font-weight:800" value="${draft.wage}" oninput="draft.wage=this.value">
      <div class="chips">${{day:[350,500,650,800],month:[5000,8000,12000],piece:[15,25,50]}[draft.per].map(v=>`<button onclick="draft.wage='${v}';render()">₹${v}</button>`).join('')}</div>
      <div class="days">${DAYS.map((d,i)=>`<button aria-pressed="${draft.days.has(i)}" onclick="draft.days.has(${i})?draft.days.delete(${i}):draft.days.add(${i});render()">${d}</button>`).join('')}</div>
      <div class="chips">${l.q.map((n,i)=>`<button aria-pressed="${draft.pd===i}" onclick="draft.pd=${i};render()">${n}</button>`).join('')}</div>
    </div>

    <div class="card">
      <div class="card-hd"><div class="badge-pic">${I('speaker',28)}</div><h2>3. ${l.ui.listen}</h2></div>
      ${renderKaraoke('k-draft',preview)}
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn speak" onclick="speakText('${preview.replace(/'/g,"\\'")}','${db.lang}',{onWord:(wi)=>highlightWord('k-draft',wi)})">${I('speaker',24)}${l.ui.listen}</button>
        <button class="btn ${recState.recording?'bad':'ghost'}" onclick="toggleVoiceRecord((data)=>{draft.voiceClip=data})">${I('mic',24)}${recState.recording?'Stop':draft.voiceClip?'Mic OK':'Mic'}</button>
        <button class="btn green full" onclick="createOffer()">${I('check',26)}${l.ui.sign}</button>
      </div>
    </div>`;
  }

  if(tab==='approve'){
    const rows=[];
    db.c.forEach((c,i)=>c.esc.days.forEach((d,j)=>{if(d.st==='pending'||d.st==='disputed')rows.push({c,i,d,j});}));
    return`<div class="pic-banner">
      <div class="pic-scene">${PIC('vault',64)}</div>
      <h1>${l.ui.approve} (${rows.length})</h1>
    </div>
    ${rows.length?rows.map(({c,i,d,j})=>`<div class="card">
      <div class="card-hd"><div class="badge-pic">${I('user',28)}</div><h2>${c.terms.wrkName||l.ui.wrk} · ${inr(d.amt)}</h2><span class="status-tag ${d.st==='disputed'?'bad':'warn'}">${d.d}</span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        ${d.st==='pending'?`<button class="btn green" onclick="settleDay(${i},${j},false).then(()=>render())">${I('check',24)}${l.ui.approve}</button><button class="btn bad" onclick="disputeDay(${i},${j})">${I('alert',24)}!</button>`:`<button class="btn green" onclick="resolveDispute(${i},${j},true)">${I('check',24)}${l.ui.approve}</button><button class="btn ghost" onclick="resolveDispute(${i},${j},false)">${I('undo',24)}₹</button>`}
      </div>
    </div>`).join(''):`<div class="card" style="text-align:center"><h2>0</h2></div>`}`;
  }

  const own=db.w.tx.filter(x=>['topup','fund','refund'].includes(x.k));
  return`<div class="pic-banner">
    <div class="pic-scene">${PIC('bank-pay',64)}</div>
    <h1>${l.ui.wallet}</h1>
  </div>
  <div class="card" style="text-align:center">
    <div class="amt-big">${inr(db.w.e)}</div>
    <div class="chips" style="justify-content:center">${[1000,2500,5000,10000].map(v=>`<button onclick="db.w.e+=${v};tx('topup',${v},'Bank');saveDB();enqueueSync('WALLET_TOPUP','WALLET','Topped up '+inr(${v}),{amt:${v}});render()">+₹${v}</button>`).join('')}</div>
  </div>
  <div class="card">
    ${own.map(x=>`<div class="drow"><div><strong>${inr(x.amt)}</strong> · ${x.note}</div></div>`).join('')}
  </div>`;
}

function renderContractCard(c,i,role){
  const t=c.terms,cl=L[db.lang],w=cl.work[t.work],open=nowD()<c.until&&c.status==='active';
  const a=dayAmt(t);
  const stTag=c.status==='offer'?`<span class="status-tag warn">${I('clock',18)}${cl.ui.offers}</span>`:c.status==='withdrawn'?`<span class="status-tag bad">${cl.ui.cancel}</span>`:open?`<span class="status-tag warn">24h</span>`:`<span class="status-tag ok">${I('shield',18)}OK</span>`;

  return`<article class="tk">
    <div class="tkh">
      <div>
        <div class="tkt">${role==='employer'?(t.wrkName||cl.ui.wrk):(t.empName||cl.ui.emp)}</div>
        <div class="tks">${t.id}</div>
      </div>
      <div class="shape-match" style="margin-left:auto;color:#0b1f3a">${shapeFingerprint(c.hash)}</div>
      ${stTag}
    </div>
    <div class="tkb">
      ${renderPictureEquation(c)}
      <div id="ver-${i}" style="margin:6px 0"></div>

      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px">
        <button class="btn speak" onclick="speakText('${cl.sum(w[1],t.wage,cl.per[t.per],t.days.length,t.pd).replace(/'/g,"\\'")}','${db.lang}',{audioData:${c.voiceClip?`'${c.voiceClip}'`:'null'}})">${I('speaker',24)}${cl.ui.listen}</button>
        <button class="btn sm ghost" onclick="verifyContract(${i})">${I('search',20)}${cl.ui.verify}</button>
        <button class="btn sm ghost" onclick="openPack(${i})">${I('file',20)}PDF / ID</button>
        ${role==='employer'?`<button class="btn sm bad" onclick="tamperDemo(${i})">${I('alert',20)}Test</button>`:''}
        ${role==='worker'&&open?`<button class="btn sm bad" onclick="workerCancel(${i})">${I('undo',20)}24h ${cl.ui.cancel}</button>`:''}
        <div class="qr-box" style="margin-left:auto" onclick="openQrModal(${i})" role="button" tabindex="0">
          ${makeQrSvg(`saboot:${t.id}:${c.hash.slice(0,16)}`)}
          <span class="qr-cap">${t.id}</span>
        </div>
      </div>

      ${c.status==='active'?`<div class="esc-box">
        ${role==='employer'?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
          <button class="btn sm green" onclick="fundEscrow(${i},1)">${I('lock',20)}+1d (${inr(a)})</button>
          <button class="btn sm green" onclick="fundEscrow(${i},${t.days.length})">${I('lock',20)}+${t.days.length}d (${inr(a*t.days.length)})</button>
          <button class="btn sm ghost" onclick="reclaimEscrow(${i})">${I('undo',20)}₹</button>
        </div>`:`<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px">
          ${t.per==='piece'?`<input class="inp" type="number" min="1" style="width:100px" value="${pieceInputs[t.id]||10}" oninput="pieceInputs['${t.id}']=this.value" aria-label="Count">`:''}
          <button class="btn green full" onclick="workerCheckIn(${i})">${I('check',26)}${cl.ui.worked}</button>
        </div>`}
        ${[...c.esc.days].map((d,j)=>[d,j]).reverse().slice(0,3).map(([d,j])=>`<div class="drow">
          <div><strong>${d.d}</strong> · <strong>${inr(d.amt)}</strong></div>
          ${d.st==='pending'&&role==='employer'?`<div style="display:flex;gap:6px"><button class="btn sm green" onclick="settleDay(${i},${j},false).then(()=>render())">${I('check',20)}${cl.ui.approve}</button><button class="btn sm bad" onclick="disputeDay(${i},${j})">!</button></div>`:`<span class="status-tag ${d.st==='paid'||d.st==='auto'?'ok':d.st==='disputed'?'bad':'wait'}">${d.st==='auto'?'24h OK':d.st==='paid'?'OK':d.st==='disputed'?'!':'...'}</span>`}
        </div>`).join('')}
      </div>`:''}
    </div>
  </article>`;
}

/* ==========================================================================
   MASTER RENDER
   ========================================================================== */
function render(){
  if(!db)return;
  const l=L[db.lang];
  renderSyncStatus();

  $('#topbar').innerHTML=`<div class="topbar-in">
    <button class="brand" onclick="db.role=null;saveDB();render()">
      ${EMBLEM}
      <span>
        <span class="brand-title">SABOOT · सबूत</span>
        <span class="brand-sub">23 INDIAN LANGUAGES · OFFLINE-FIRST</span>
      </span>
    </button>
    <div class="top-actions">
      <button class="lang-pill" onclick="openLangModal()">
        ${I('globe',24)}
        <span>${l.n}</span>
        ${I('speaker',22)}
      </button>
    </div>
  </div>`;

  $('#rolebar').innerHTML=`<div class="role-bar-in">
    <button class="role-tab" aria-pressed="${db.role==='worker'}" onclick="setRole('worker')">${I('user',24)}<span>${l.ui.wrk}</span></button>
    <button class="role-tab" aria-pressed="${db.role==='employer'}" onclick="setRole('employer')">${I('brief',24)}<span>${l.ui.emp}</span></button>
  </div>`;

  if(!db.role){
    $('#bnav').style.display='none';
    $('#app').innerHTML=renderOnboarding();
    return;
  }

  $('#bnav').style.display='grid';
  const isEmp=db.role==='employer';
  const offersCount=db.c.filter(c=>c.status==='offer').length;
  const pendingCount=db.c.reduce((n,c)=>n+c.esc.days.filter(d=>d.st==='pending'||d.st==='disputed').length,0);
  const activeCount=db.c.filter(c=>c.status==='active'&&nowD()<c.until).length;

  const navItems=isEmp?[
    ['roster','shield',l.ui.roster,0],
    ['create','plus',l.ui.create,0],
    ['approve','check',l.ui.approve,pendingCount],
    ['bizwal','wallet',l.ui.wallet,0]
  ]:[
    ['agreements','brief',l.ui.agreements,activeCount],
    ['offers','file',l.ui.offers,offersCount],
    ['payments','wallet',l.ui.payments,0],
    ['history','clock',l.ui.history,0]
  ];

  $('#bnav').innerHTML=navItems.map(([k,ic,lbl,b])=>`<button aria-current="${tab===k}" onclick="tab='${k}';render()">
    ${I(ic,26)}
    <span>${lbl}</span>
    ${b?`<span class="nbadge">${b}</span>`:''}
  </button>`).join('');

  $('#app').innerHTML=isEmp?renderEmployerUI():renderWorkerUI();
}

if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=()=>render();
initSeedData().then(()=>{sweepAutoPay();processSyncQueue(true);render();});
setInterval(()=>{sweepAutoPay();if(isAppOnline())processSyncQueue(true);},60000);
</script>
</body>
</html>
